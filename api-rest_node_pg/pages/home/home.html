<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Wiss Mall</title>

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="home.css">  
</head>
<body>

<header>
  <div class="logo">wiss <span>mall</span></div>

  <nav>
    <a href="#">sobre nos</a>
    <a href="#">delivery</a>
    <a href="#">cadastro</a>
    <a href="#" class="btn">contato</a>
  </nav>
</header>

<section class="hero">

  <h1>wiss <span>mall</span></h1>

  <div class="divider">
    <div></div>
    <i class="fa-solid fa-lock"></i>
    <div></div>
  </div>

  <p>Seu shopping de presentes, novidades<br>e muito mais!</p>

  <div class="cards">

    <div class="card">
      <i class="fa-solid fa-phone"></i>
      <h3>contato</h3>
      <span>Fale conosco</span>
    </div>

    <div class="card">
      <i class="fa-solid fa-user"></i>
      <h3>sobre nos</h3>
      <span>Conheça nossa loja</span>
    </div>

    <div class="card">
      <i class="fa-solid fa-motorcycle"></i>
      <h3>delivery</h3>
      <span>Receba em casa</span>
    </div>

    <div class="card">
      <i class="fa-solid fa-clipboard-list"></i>
      <h3>cadastro</h3>
      <span>Crie sua conta</span>
    </div>

  </div>

  <div class="scroll">
    <i class="fa-solid fa-angle-down"></i>
    <p>role para baixo</p>
  </div>

</section>

</body>
</html>
